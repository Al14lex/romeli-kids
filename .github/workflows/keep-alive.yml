# Keeps the free Render backend awake: Render free services sleep after
# 15 minutes without visitors. This pings the server every ~10 minutes.
# GitHub may delay scheduled runs a little; that is fine.
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        run: |
          URL="https://romeli-kids.onrender.com/api/health"
          for attempt in 1 2 3; do
            # Any HTTP answer means the server is awake (a sleeping server needs ~1 min to answer).
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" != "000" ]; then exit 0; fi
            sleep 20
          done
          echo "Backend did not respond"
          exit 1
