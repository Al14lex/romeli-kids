<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>
    <link rel="icon" type="image/png" href="public/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="public/favicon/favicon.svg" />
    <link rel="shortcut icon" href="public/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="public/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Romeli_kids" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Playfair+Display+SC&family=Raleway:wght@500&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/css/styles.css" />

    <style>
      .product-previews-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 14px;
      }

      .product-preview-item {
        position: relative;
        border: 2px solid transparent;
        border-radius: 8px;
        overflow: hidden;
        padding: 0;
        cursor: pointer;
        background: #fff;
      }

      .product-preview-item img {
        width: 100%;
        object-fit: cover;
        display: block;
      }

      .product-preview-item.is-cover {
        border-color: #0d8f4a;
      }

      .cover-badge {
        position: absolute;
        top: 6px;
        left: 6px;
        background: #0d8f4a;
        color: #fff;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 999px;
      }

      .preview-remove {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 22px;
        height: 22px;
        font-weight: 600;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #990404;
        cursor: pointer;
        line-height: 0;
      }

      .cover-hint {
        font-size: 13px;
        opacity: 0.8;
      }
    </style>
  </head>

  <body class="admin-page">
  <a href="/" class="btn btn-home" id="go-home">Дім</a>
  <h1 class="admin-title">Адмін панель</h1>

  <main class="admin-main" id="admin-main">
    <section id="admin-search-section" class="admin-section">
      <h2>Знайти одиницю товару</h2>

      <form id="search-form" class="search-form">
        <input type="text" id="search-input" placeholder="Rk-a1b2c" required />
        <button type="submit">Пошук</button>
      </form>

      <div id="search-result-box" class="search-result-box"></div>

      <template id="search-photo-card-template">
        <article class="photo-card editable-card">
          <div class="photo-card-left">
            <img class="photo-thumb" src="" alt="Фото товару" />
          </div>
          <div class="photo-card-right">
            <label>
              Артикль:
              <input type="text" name="sku" disabled />
            </label>
            <label>
              Ціна:
              <input type="number" name="price" min="0" />
            </label>
            <label>
              Акційна ціна:
              <input
                type="number"
                name="salePrice"
                min="0"
                placeholder="необов’язково"
              />
            </label>
            <label>
              Тип:
              <input type="text" name="type" />
            </label>
            <label>
              Розмір:
              <input type="text" name="size" />
            </label>
            <label>
              Категорія:
              <input type="text" name="category" disabled />
            </label>
            <div class="card-actions">
              <button type="button" class="btn-save">Зберегти</button>
              <button type="button" class="btn-delete">Видалити</button>
            </div>
          </div>
        </article>
      </template>
    </section>

    <section
      class="upload-section"
      id="product-upload-section"
      aria-labelledby="product-upload-title"
    >
      <div class="section-head">
        <h2 class="section-title" id="product-upload-title">Завантаження</h2>
        <button type="button" class="btn btn-primary" id="product-pick-files">
          вибрати фото
        </button>
        <input
          type="file"
          id="product-file-input"
          class="visually-hidden"
          accept="image/*"
          multiple
          aria-hidden="true"
        />
      </div>

      <div
        class="cards-grid"
        id="product-cards-grid"
        aria-live="polite"
        aria-busy="false"
      >
        <article class="photo-card" id="product-card">
          <div class="photo-meta">
            <div class="field">
              <label for="product-sku">Артикль</label>
              <input
                type="text"
                id="product-sku"
                name="sku"
                class="input"
                readonly
              />
            </div>

            <div class="field">
              <label for="product-category">Категорія</label>
              <select
                id="product-category"
                name="category"
                class="input"
                required
              >
                <option value="girls">girls</option>
                <option value="boys">boys</option>
              </select>
            </div>

            <div class="field">
              <label for="product-price">Ціна</label>
              <input
                type="number"
                id="product-price"
                name="price"
                class="input"
                inputmode="decimal"
                min="0"
                step="0.01"
                required
              />
            </div>

            <div class="field">
              <label for="product-sale-price">Акційна ціна</label>
              <input
                type="number"
                id="product-sale-price"
                name="salePrice"
                class="input"
                inputmode="decimal"
                min="0"
                step="0.01"
                placeholder="необов’язково"
              />
            </div>

            <div class="field">
              <label for="product-type">Тип</label>
              <input
                type="text"
                id="product-type"
                name="type"
                class="input"
                placeholder="bluzka"
                required
              />
            </div>

            <div class="field">
              <label for="product-size">Розмір</label>
              <input
                type="text"
                id="product-size"
                name="size"
                class="input"
                placeholder="104"
                required
              />
            </div>
          </div>
          <div id="product-previews-grid" class="product-previews-grid"></div>
        </article>
      </div>

      <div class="section-actions">
        <button
          type="button"
          class="btn btn-success"
          id="product-upload"
          disabled
        >
          Завантажити
        </button>
      </div>

      <div
        class="upload-progress"
        id="product-upload-progress"
        aria-live="polite"
        hidden
      >
        <label for="product-progress-bar" class="progress-label"
          >Завантаження...</label
        >
        <progress id="product-progress-bar" value="0" max="100">0%</progress>
        <span class="progress-text" id="product-progress-text">0%</span>
      </div>

      <div
        class="upload-result"
        id="product-upload-result"
        role="status"
        aria-live="polite"
        hidden
      >
        <p class="success-message">Успішно завантажено!</p>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  <script src="/js/admin.js" type="module" defer></script>
</body>
</html>
